name: Diagnosticar canais Discord
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnosticar-discord.yml'
      - 'diagnostico.py'
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Consultar canais diretamente na API do Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python diagnostico.py
