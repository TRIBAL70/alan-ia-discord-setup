name: Limpar duplicatas auditadas Discord
on:
  push:
    paths:
      - '.github/workflows/limpar-duplicatas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-channel-maintenance
  cancel-in-progress: false
jobs:
  limpeza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Revalidar e limpar apenas duplicatas vazias autorizadas
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u limpar_duplicatas.py
