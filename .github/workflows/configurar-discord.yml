name: Configurar servidor Discord
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-setup-alunos-dev-club
  cancel-in-progress: false
jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Configurar canais e cargos
        timeout-minutes: 7
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u instalar.py
